[project]
name = "ads-generator"
version = "0.1.0"
description = "Générateur d'images de chat avec DALL-E et GPT-Image-1"
authors = [
    {name = "Kevin Didelot", email = "kevin@keltio.fr"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.3.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.1",
    "requests>=2.31.0",
    "opencv-python>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
chat-image-generator = "chat_image_generator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = [
    "chat_image_generator.py",
    "example_usage.py",
    "README.md",
    "env_example.txt",
    "setup.sh",
]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-branch",
    "--cov-fail-under=60"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
    "*/conftest.py"
]

[tool.coverage.report]
# Coverage minimum requirements - fail if below 85%
fail_under = 85

exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]
show_missing = true
precision = 2 